[project]
name = "sir-client"
version = "0.1.0"
description = "Client for the stupid inference router: one call, whether the model is loaded or not."
readme = "README.md"
requires-python = ">=3.12"
# httpx and nothing else. Services depend on this package; anything added here is added to
# every one of them, and the server's dependencies in particular have no business here.
dependencies = [
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sir_client"]
