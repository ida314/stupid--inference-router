[project]
name = "stupid-inference-router"
version = "0.1.0"
description = "A model-aware local inference scheduler that presents one API endpoint while dynamically allocating a memory-constrained GPU between multiple LLM workloads."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    # The Triton backend's transport. A runtime dependency rather than a dev one since
    # Phase 2: talking to a real backend is what the router is for.
    "httpx>=0.27",
]

[project.scripts]
sir = "sir.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    # The client ships from this repo so the wire format has one home: a change to the
    # protocol touches both sides in one commit, and the contract tests drive the real
    # SDK against the real app in-process. Services install `sir-client` alone and never
    # see FastAPI, uvicorn or PyYAML.
    "sir-client",
]

[tool.uv.workspace]
members = ["clients/python"]

[tool.uv.sources]
sir-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
