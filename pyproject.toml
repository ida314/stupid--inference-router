[project]
name = "stupid-inference-router"
version = "0.1.0"
description = "A model-aware local inference scheduler that presents one API endpoint while dynamically allocating a memory-constrained GPU between multiple LLM workloads."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.scripts]
sir = "sir.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
